name: Cross-Engine CI

# The cross-engine migration test (design/Arch-Specs/STRATA-SPEC-005.md, "Conformance";
# schema/fixtures/cross-engine/scenario.json). Each engine writes a SQLite file and a Postgres schema at the
# checkpoints component's schema version 1, and another at the current version with deltas and offload; the CLI
# reads both engines' version 1 databases read-only, before any engine migrates them; then each engine opens the
# other's with its current stores, migrates, reads every checkpoint and resumes threads to the end, and the CLI
# reads what the .NET engine wrote. The same tests run on their own, each engine reading what it wrote, in
# rust-ci.yml and dotnet-ci.yml.

on:
    workflow_dispatch:
    push:
        branches: [main]
        tags: ['v*']
    pull_request:
        branches: [main]

env:
    CARGO_TERM_COLOR: always

jobs:
    cross-engine:
        name: One Engine Reads What the Other Wrote
        runs-on: ubuntu-latest
        env:
            STRATA_TEST_POSTGRES_URL: postgres://strata:strata@localhost:5432/strata
            STRATA_INTEROP_DIR: ${{ github.workspace }}/cross-engine
        services:
            postgres:
                image: pgvector/pgvector:pg16
                env:
                    POSTGRES_USER: strata
                    POSTGRES_PASSWORD: strata
                    POSTGRES_DB: strata
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U strata -d strata"
                    --health-interval 2s
                    --health-timeout 3s
                    --health-retries 30
        steps:
            - uses: actions/checkout@v4

            - name: Setup Rust Toolchain
              uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

            - name: Setup .NET SDK
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: '10.0.x'

            - name: Build the Rust Test and the CLI
              run: |
                  (cd rust && cargo test -p datalium-strata-memory --test cross_engine --no-run)
                  (cd cli && cargo test --test cross_engine --no-run)

            - name: Build the .NET Tests
              run: dotnet build dotnet/tests/Datalium.Strata.Tests --configuration Release

            - name: Rust Writes
              working-directory: rust
              env:
                  STRATA_INTEROP_STEP: write
              run: cargo test -p datalium-strata-memory --test cross_engine

            - name: .NET Writes
              env:
                  STRATA_INTEROP_STEP: write
              run: >-
                  dotnet test dotnet/tests/Datalium.Strata.Tests --configuration Release --no-build
                  --filter "FullyQualifiedName~Datalium.Strata.Tests.Backends.CrossEngineTests"

            # The CLI opens every store read-only (design/51-Read-Only-Store-Open.md), so it reads both engines'
            # version 1 databases as they were written and leaves them, unmigrated, for the steps below.
            - name: The CLI Reads Both Engines' Version 1 Databases Before Any Engine Migrates Them
              working-directory: cli
              env:
                  STRATA_INTEROP_STEP: read-older
              run: cargo test --test cross_engine

            - name: Rust Reads, Migrates and Resumes What .NET Wrote
              working-directory: rust
              env:
                  STRATA_INTEROP_STEP: read
              run: cargo test -p datalium-strata-memory --test cross_engine

            - name: .NET Reads, Migrates and Resumes What Rust Wrote
              env:
                  STRATA_INTEROP_STEP: read
              run: >-
                  dotnet test dotnet/tests/Datalium.Strata.Tests --configuration Release --no-build
                  --filter "FullyQualifiedName~Datalium.Strata.Tests.Backends.CrossEngineTests"

            - name: The CLI Reads What .NET Wrote
              working-directory: cli
              env:
                  STRATA_INTEROP_STEP: read
              run: cargo test --test cross_engine
