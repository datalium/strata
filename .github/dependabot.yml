# Weekly dependency updates.
# One grouped PR per ecosystem. Major versions are skipped until after the 0.9.0-preview.1
# launch; security updates are not affected by either setting.
version: 2
updates:
    # One entry per Cargo workspace: a group spanning both fails, since /cli uses /rust by path.
    - package-ecosystem: cargo
      directory: /rust
      schedule:
          interval: weekly
      groups:
          cargo-rust:
              patterns: ['*']
      ignore:
          - dependency-name: '*'
            update-types: ['version-update:semver-major']
          # rusqlite 0.41 and later need Rust 1.89; the crates declare 1.88. Remove when that rises.
          - dependency-name: 'rusqlite'
            versions: ['>= 0.41']
    - package-ecosystem: cargo
      directory: /cli
      schedule:
          interval: weekly
      groups:
          cargo-cli:
              patterns: ['*']
      ignore:
          - dependency-name: '*'
            update-types: ['version-update:semver-major']
          # rusqlite 0.41 and later need Rust 1.89; the crates declare 1.88. Remove when that rises.
          - dependency-name: 'rusqlite'
            versions: ['>= 0.41']
    - package-ecosystem: nuget
      directory: /dotnet
      schedule:
          interval: weekly
      groups:
          nuget:
              patterns: ['*']
      ignore:
          - dependency-name: '*'
            update-types: ['version-update:semver-major']
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      groups:
          github-actions:
              patterns: ['*']
      ignore:
          - dependency-name: '*'
            update-types: ['version-update:semver-major']
