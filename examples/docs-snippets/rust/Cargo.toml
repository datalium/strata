# The Rust code samples on stratamesh.dev (strata-management ADR-0001, rule 2). Each sample is a region in a
# test, so CI compiles it and runs it. examples/docs-snippets/README.md describes the region markers.
[package]
name = "strata-docs-snippets"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]

[dev-dependencies]
chrono = "0.4"
datalium-strata = { path = "../../../rust/strata-core" }
datalium-strata-ai = { path = "../../../rust/strata-ai" }
datalium-strata-cloud = { path = "../../../rust/strata-cloud" }
datalium-strata-host = { path = "../../../rust/strata-host" }
datalium-strata-memory = { path = "../../../rust/strata-memory" }
# The samples on /guides/tools/mcp-servers/, and the inventory-mcp example they connect to.
datalium-strata-mcp = { path = "../../../rust/strata-mcp" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# The TLS sample on /guides/persistence/postgres/.
native-tls = "0.2"
postgres-native-tls = "0.5"
tokio-postgres = "0.7"
# The OpenTelemetry sample on /guides/production/observability/.
opentelemetry = "0.33"
opentelemetry-stdout = "0.33"
opentelemetry_sdk = "0.33"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
redis = { version = "1.7.0", default-features = false, features = ["aio", "tokio-comp"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# signal: the hosting sample's Ctrl+C. sync: the memory samples' shared file. test-util and time: the paused clock
# the timer, retry and lease samples run on. io-util and net: the HTTP server the MCP samples connect to.
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
