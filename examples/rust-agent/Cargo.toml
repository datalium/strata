[package]
name = "strata-rust-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4"
datalium-strata = { path = "../../rust/strata-core" }
datalium-strata-memory = { path = "../../rust/strata-memory" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
