[package]
name = "datalium-strata-cloud"
description = "The Strata Cloud checkpoint store, decisions client and decision worker for Datalium Strata"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
chrono = "0.4"
datalium-strata = { workspace = true }
flate2 = "1"
metrics = "0.24"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }
tokio-util = "0.7"
tracing = "0.1"
uuid = { version = "1.18", features = ["v7"] }

[dev-dependencies]
datalium-strata-memory = { workspace = true }
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
metrics-util = { version = "0.20", default-features = false, features = ["debugging"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
