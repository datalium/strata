[package]
name = "datalium-strata-memory"
description = "In-memory, SQLite, Postgres and Redis persistence adapters for Datalium Strata"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
chrono = "0.4"
datalium-strata = { workspace = true }
deadpool-postgres = { version = "0.14", default-features = false, features = ["rt_tokio_1"] }
metrics = "0.24"
redis = { version = "1.7.0", default-features = false, features = ["aio", "connection-manager", "script", "tokio-comp"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1_smol = "1"
sha2 = "0.10"
# sqlite-vec's C source, compiled in with SQLITE_CORE against rusqlite's bundled
# SQLite: the SQLite memory store's vec_distance_cosine (design/45).
sqlite-vec = "0.1.9"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
tracing = "0.1"

[dev-dependencies]
metrics-util = { version = "0.20", default-features = false, features = ["debugging"] }
# Sync client for test sandboxes only (schema setup, raw row inspection), run on
# a thread of its own: it panics inside a tokio runtime.
postgres = { version = "0.19.14", features = ["with-serde_json-1"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "test-util"] }
