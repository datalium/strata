[package]
name = "datalium-strata-host"
description = "Driver loops, settings and a store health probe for hosting Datalium Strata in a service"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
chrono = "0.4"
datalium-strata = { workspace = true }
datalium-strata-memory = { workspace = true }
metrics = "0.24"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "time"] }
tracing = "0.1"

[dev-dependencies]
metrics-util = { version = "0.20", default-features = false, features = ["debugging"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "test-util"] }
# For the settings tests' sandboxes: a schema of their own in Postgres, and cleaning up their Redis keys.
redis = { version = "1.7.0", default-features = false, features = ["aio", "tokio-comp"] }
tokio-postgres = "0.7"
