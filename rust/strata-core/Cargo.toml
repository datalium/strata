[package]
name = "datalium-strata"
description = "The Datalium Strata engine: typed state graphs for AI agents with compile-time validation, streaming, human-in-the-loop interrupts and durable execution"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
base64 = "0.22"
chrono = "0.4"
datalium-strata-macros = { workspace = true }
metrics = "0.24"
pin-project-lite = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "time", "macros"] }
tokio-util = "0.7"
tracing = "0.1"
uuid = { version = "1.18", features = ["v7"] }

[dev-dependencies]
metrics-util = { version = "0.20", default-features = false, features = ["debugging"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util", "time"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
