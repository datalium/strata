[workspace]
members = ["strata-core", "strata-macros", "strata-memory", "strata-cloud", "strata-host", "strata-ai", "strata-bench"]
resolver = "2"

# design/36-Packaging-And-Versioning.md: one version for every crate, the .NET packages and the CLI.
# .github/scripts/versions.sh checks that it equals dotnet/Directory.Build.props's and cli/Cargo.toml's.
[workspace.package]
version = "0.9.0-preview.1"
edition = "2024"
authors = ["Datalium <strata@datalium.com>"]
license = "Apache-2.0"
repository = "https://github.com/datalium/strata"
homepage = "https://stratamesh.ai"
readme = "README.md"
keywords = ["agents", "orchestration", "state-graph", "llm", "workflow"]
categories = ["asynchronous"]

# The crates depend on each other at exactly this version: they are released together, and crates.io
# refuses a path dependency that has no version.
[workspace.dependencies]
datalium-strata = { path = "strata-core", version = "=0.9.0-preview.1" }
datalium-strata-macros = { path = "strata-macros", version = "=0.9.0-preview.1" }
datalium-strata-memory = { path = "strata-memory", version = "=0.9.0-preview.1" }
datalium-strata-cloud = { path = "strata-cloud", version = "=0.9.0-preview.1" }
datalium-strata-host = { path = "strata-host", version = "=0.9.0-preview.1" }
datalium-strata-ai = { path = "strata-ai", version = "=0.9.0-preview.1" }
